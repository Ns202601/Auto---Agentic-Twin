[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-twin"
version = "0.1.0"
description = "Commercial-vehicle research data tooling (cvtwin) and the LangGraph idea orchestrator (twinorch)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
orchestrator = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langgraph-checkpoint-postgres>=3.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "anthropic>=2.6",
    "fastapi>=0.160",
    "uvicorn>=0.50",
    "pydantic>=2.10",
]
dev = ["pytest>=7", "httpx>=0.28", "pandas>=2.0", "numpy>=1.24"]

[project.scripts]
cvtwin = "cvtwin.cli:main"
twinorch = "twinorch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvtwin = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
